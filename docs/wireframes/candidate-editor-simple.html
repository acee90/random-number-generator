</div>
<style>

#candidate-simple-wireframe .ce-list { padding: 0; margin: 0; list-style: none; }
#candidate-simple-wireframe .ce-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 5px; align-items: center; min-height: 44px; padding-block: 4px; border-bottom: 1px solid var(--ce-line); }
#candidate-simple-wireframe .ce-row.ce-selecting { grid-template-columns: auto minmax(0,1fr) auto auto; }

#candidate-simple-wireframe .ce-name-column { min-width: 0; }
#candidate-simple-wireframe .ce-name { padding: 6px 0; min-height: 32px; max-width: 100%; text-align: left; justify-content: flex-start; border: 0; background: transparent; font-size: 15px; }
#candidate-simple-wireframe .ce-name:hover { text-decoration: underline; text-underline-offset: 4px; }
#candidate-simple-wireframe .ce-name-column small { display: block; color: var(--ce-muted); font-size: 11px; }
#candidate-simple-wireframe .ce-tag { min-height: 32px; max-width: 110px; font-size: 12px; padding: 5px 8px; border-color: var(--ce-line); background: var(--ce-paper); }
#candidate-simple-wireframe .ce-row-edit { display: flex; align-items: center; gap: 4px; }
#candidate-simple-wireframe .ce-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--ce-line); }
#candidate-simple-wireframe .ce-footer-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }

#candidate-simple-wireframe .ce-note { color: var(--ce-muted); font-size: 13px; }
#candidate-simple-wireframe .ce-error { color: var(--ce-danger); font-size: 13px; margin-block: 8px; }
#candidate-simple-wireframe .ce-stage { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--ce-muted); }
#candidate-simple-wireframe .ce-stage > strong { color: var(--ce-ink); font-weight: 500; background: var(--ce-soft); padding: 4px 7px; }
#candidate-simple-wireframe .ce-notice { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 8px 10px; margin-block: 10px; background: var(--ce-soft); font-size: 12px; }
#candidate-simple-wireframe .ce-notice button { min-height: 32px; padding: 4px 6px; font-size: 12px; }
#candidate-simple-wireframe .ce-empty { text-align: center; padding-block: 26px; display: grid; gap: 12px; }
#candidate-simple-wireframe .ce-empty h3 { font-size: 19px; }
#candidate-simple-wireframe .ce-paths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#candidate-simple-wireframe .ce-paths button { min-height: 108px; flex-direction: column; align-items: flex-start; padding: 14px; text-align: left; }
#candidate-simple-wireframe .ce-paths small { font-size: 12px; color: var(--ce-muted); }
#candidate-simple-wireframe .ce-guest-list { margin-top: 14px; }
#candidate-simple-wireframe .ce-guest-row { min-height: 50px; display: flex; align-items: center; gap: 8px; padding-block: 8px; border-bottom: 1px solid var(--ce-line); }
#candidate-simple-wireframe .ce-guest-row > div { min-width: 0; flex: 1; overflow-wrap: anywhere; }
#candidate-simple-wireframe .ce-guest-row small { display: block; color: var(--ce-muted); font-size: 11px; }
#candidate-simple-wireframe .ce-guest-category { font-size: 12px; color: var(--ce-muted); }
#candidate-simple-wireframe .ce-wheel { width: min(100%,250px); aspect-ratio: 1; border: 2px solid var(--ce-input); border-radius: 50%; margin: 18px auto; display: grid; place-items: center; background: conic-gradient(var(--ce-soft) 0deg 60deg,var(--ce-panel) 60deg 120deg,var(--ce-soft) 120deg 180deg,var(--ce-panel) 180deg 240deg,var(--ce-soft) 240deg 300deg,var(--ce-panel) 300deg); position: relative; }
#candidate-simple-wireframe .ce-wheel::before { content: "▼"; position: absolute; top: -14px; }
#candidate-simple-wireframe .ce-wheel > button { border-radius: 50%; width: 100px; height: 100px; flex-direction: column; }
#candidate-simple-wireframe .ce-exclusions { padding-block: 12px; border-block: 1px solid var(--ce-line); margin-block: 14px; }
#candidate-simple-wireframe .ce-exclusion-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#candidate-simple-wireframe .ce-exclusion-toggle label { display: flex; align-items: center; gap: 8px; min-height: 40px; }
#candidate-simple-wireframe .ce-result { text-align: center; padding-block: 20px; }
#candidate-simple-wireframe .ce-result h3 { font-size: 25px; margin-block: 12px; }
#candidate-simple-wireframe .ce-live { font-size: 12px; color: var(--ce-muted); margin-top: 10px; }
#candidate-simple-wireframe dialog { padding: 20px; width: min(430px,calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; border: 1px solid var(--ce-input); border-radius: 6px; color: var(--ce-ink); background: var(--ce-panel); }
#candidate-simple-wireframe dialog::backdrop { background: light-dark(#1b231b66,#0009); }
#candidate-simple-wireframe .ce-dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
#candidate-simple-wireframe .ce-dialog-heading h3 { font-size: 19px; }
#candidate-simple-wireframe .ce-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

#candidate-simple-wireframe .ce-source button { justify-content: space-between; text-align: left; }

#candidate-simple-wireframe .ce-readonly { list-style: none; margin: 12px 0; padding: 0; }
#candidate-simple-wireframe .ce-readonly li { padding: 9px 0; border-bottom: 1px solid var(--ce-line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; }
#candidate-simple-wireframe .ce-readonly small { color: var(--ce-muted); }
@media (max-width: 820px) { #candidate-simple-wireframe .ce-roles { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 420px) {
  #candidate-simple-wireframe .ce-pane { padding: 12px; }
  #candidate-simple-wireframe .ce-room { padding-inline: 12px; }
  #candidate-simple-wireframe .ce-tag { max-width: 90px; }
  #candidate-simple-wireframe .ce-caption { padding-right: 0; }
  #candidate-simple-wireframe .ce-paths { grid-template-columns: 1fr; }
}
@media (pointer: coarse) {
  #candidate-simple-wireframe button,#candidate-simple-wireframe .ce-menu > summary { min-height: 44px; }
  #candidate-simple-wireframe .ce-icon { width: 44px; }
}
</style>
<script>
(() => {
  const root = document.getElementById("candidate-simple-wireframe");
  const host = root.querySelector("#ce-host");
  const guest = root.querySelector("#ce-guest");
  const modal = root.querySelector("#ce-modal");
  const confirm = root.querySelector("#ce-confirm");
  const rowPopup = root.querySelector("#ce-row-popup");
  const copy = value => JSON.parse(JSON.stringify(value));
  const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  const icon = name => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
  const base = [
    { id:"sample-1", name:"김치찌개", category:"한식" },
    { id:"sample-2", name:"돈가스", category:"일식" },
    { id:"sample-3", name:"초밥", category:"일식" },
    { id:"sample-4", name:"비빔밥", category:"한식" },
    { id:"sample-5", name:"카레", category:"미분류", owner:"민지" },
    { id:"sample-6", name:"샐러드", category:"샐러드", owner:"준호" }
  ];
  const team = [
    { name:"쌀국수", category:"아시안" }, { name:"제육볶음", category:"한식" },
    { name:"수제버거", category:"팀 추천" }, { name:"덮밥", category:"일식" }
  ];
  const settings = { example:"혼합 후보", showGuest:true, failSave:false };
  function initial(example) {
    const items = example === "빈 목록" ? [] : example === "긴 목록"
      ? Array.from({ length:24 }, (_,i) => ({ ...base[i % base.length], id:"long-" + i, name:base[i % base.length].name + " " + (Math.floor(i / 6) + 1) }))
      : copy(base);
    return { v:1, example, phase:"editing", items, shared:copy(items), categories:null, manual:[],
      sharedCategories:null, sharedManual:[], sharedVersion:1, draftVersion:1,
      started:items.length > 0, readyBefore:items.length > 0, newName:"", query:"", filterOpen:false,
      editId:null, editName:"", guestName:"", guestCategory:"미분류", error:"",
      excludeDrawn:false, drawn:[], winner:null, library:[], failNext:false };
  }
  function restore(raw) {
    if (!raw || raw.v !== 1 || !Array.isArray(raw.items) || !Array.isArray(raw.shared)) return initial("혼합 후보");
    const value = { ...initial(raw.example), ...raw, pending:false, error:"", editId:null };
    if (value.phase === "drawing") value.phase = "waiting";
    return value;
  }
  const initialSaved = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent;
  let lastSavedState = JSON.stringify(initialSaved || null);
  let state = restore(initialSaved);
  settings.example = state.example;
  settings.showGuest = state.showGuest !== false;
  let pendingAction = null;
  let modalReturn = null;
  let modalReturnNode = null;
  let lastTrigger = null;
  let confirmationAction = null;
  let undo = null;
  let drawingTimer = null;
  let saveDraftItems = [];
  let rowPopupActive = false;
  let rowPopupTrigger = null;
  let rowPopupItemId = null;
  function uid() { return "candidate-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }
  function selected(items, cats, manual, applyDrawn) {
    return items.filter(item => (cats === null || cats.includes(item.category)) && !manual.includes(item.id) && (!applyDrawn || !state.excludeDrawn || !state.drawn.includes(item.id)));
  }
  function draftSelected() { return selected(state.items,state.categories,state.manual,false); }
  function readySelected() { return selected(state.shared,state.sharedCategories,state.sharedManual,true); }
  function dirty() {
    return JSON.stringify([state.items,state.categories,state.manual]) !== JSON.stringify([state.shared,state.sharedCategories,state.sharedManual]) ||
      !!state.newName.trim() || !!state.editId;
  }
  function persist() {
    if (!window.openai || !window.openai.setWidgetState) return;
    const snapshot = { ...state, pending:false, error:"", editId:null,showGuest:settings.showGuest };
    const privateContent = JSON.stringify(snapshot).length < 14000 ? snapshot : null;
    lastSavedState = JSON.stringify(privateContent);
    window.openai.setWidgetState({
      modelContent:{ view:"후보 편집 단순화", phase:state.phase, draftCount:state.items.length, selectedCount:draftSelected().length, filterOpen:state.filterOpen },
      privateContent
    }).catch(() => {});
  }
  function icons() { if (globalThis.lucide) lucide.createIcons({ attrs:{ width:17,height:17 } }); }
  function focus(selector) { requestAnimationFrame(() => {
    const el = root.querySelector(selector);
    const target = el && el.getClientRects().length ? el : root.querySelector("details.ce-menu > summary") || root.querySelector("button");
    if (target) target.focus();
  }); }
  function announce(text) { root.querySelector("#ce-live").textContent = text; }
  function disabled() { return state.pending ? " disabled" : ""; }
  function button(action,text,cls,attrs) {
    return '<button type="button" data-action="' + action + '" class="' + (cls || "") + '"' + (attrs || "") + disabled() + '>' + text + '</button>';
  }
  function hostMenu() {
    return '<details class="ce-menu"><summary aria-label="목록 작업">' + icon("ellipsis") + '</summary><div class="ce-menu-items">' +
      button("load","목록 불러오기") + button("save","내 목록에 저장","",state.items.length || state.newName.trim() ? "" : " disabled") +
      button("bulk","여러 개 추가") + button("clear","전체 비우기","ce-danger",state.items.length ? "" : " disabled") +
      (dirty() ? button("discard","변경 취소") : "") + '</div></details>';
  }
  function filters() {
    const cats = [...new Set(state.items.map(item => item.category))];
    const chosen = state.categories === null ? cats : state.categories;
    const active = state.categories !== null || state.manual.length > 0;
    let html = '<div class="ce-listbar"><span class="ce-count">전체 후보 ' + state.items.length + '개</span>' +
      button("filter-toggle",icon("sliders-horizontal") + '필터' + (active ? ' · 적용 중' : ""),"ce-filter-button",' aria-expanded="' + state.filterOpen + '" aria-controls="ce-filter-panel"') + '</div>';
    if (state.filterOpen) {
      html += '<div class="ce-filters" id="ce-filter-panel"><div class="ce-filter-chips">' +
        button("filter-all","전체","ce-chip",' aria-pressed="' + (state.categories === null) + '"') +

  function viewCandidates() {
    dialog("후보 보기",'<p class="ce-note">전체 ' + state.shared.length + '개 · 이번 추첨 ' + readySelected().length + '개</p><ul class="ce-readonly">' +
      state.shared.map(item => '<li><span>' + esc(item.name) + '</span><small>' + esc(reason(item)) + '</small></li>').join("") +
      '</ul><div class="ce-dialog-actions"><button type="button" data-action="modal-close">닫기</button></div>',selectorFor("view-candidates"));
  }
  function spin(confirmed) {
    if (state.phase !== "waiting" || !readySelected().length) return;
    if (!state.excludeDrawn && state.drawn.length && !confirmed) {
      ask("제외 내역을 초기화하고 돌릴까요?","기존 내역을 초기화하고 이번에 뽑힌 후보부터 기록합니다.",() => spin(true),"초기화하고 돌리기"); return;
    }
    const winner = copy(readySelected()[0]);
    state.phase = "drawing"; renderAndSave();
    drawingTimer = setTimeout(() => {
      if (!root.isConnected) return;
      state.winner = winner;
      state.drawn = state.excludeDrawn ? [...new Set([...state.drawn,winner.id])] : [winner.id];
      state.phase = "result"; renderAndSave(); announce(winner.name + " 예시 결과가 나왔습니다.");
    },800);
  }
  root.addEventListener("input",event => {
    const el = event.target;
    if (el.id === "ce-new-name") {
      state.newName = el.value;
      const add = el.form && el.form.querySelector('button[type="submit"]');
      if (add) add.disabled = !el.value.trim() || state.pending;
      const save = root.querySelector('[data-action="save"]');
      if (save) save.disabled = (!state.items.length && !el.value.trim()) || state.pending;
    } else if (el.id === "ce-row-name") state.editName = el.value;
    else if (el.id === "ce-guest-name") {
      state.guestName = el.value;
      el.form.querySelector('button[type="submit"]').disabled = !el.value.trim() || state.phase !== "collecting";
    } else if (el.id === "ce-search") {
      const start = el.selectionStart;
      state.query = el.value; render(); focus("#ce-search");
      requestAnimationFrame(() => { const input = root.querySelector("#ce-search"); if (input && input.setSelectionRange) { try { input.setSelectionRange(start,start); } catch {} } });
    }
  });
  root.addEventListener("change",event => {
    const el = event.target;
    if (el.dataset.select) {
      const ids = new Set(state.manual);
      if (el.checked) ids.delete(el.dataset.select); else ids.add(el.dataset.select);
      state.manual = [...ids]; renderAndSave('[data-select="' + el.dataset.select + '"]');
    } else if (el.dataset.repeat) { state.excludeDrawn = el.checked; renderAndSave('[data-repeat="true"]'); }
  });
  root.addEventListener("submit",event => {
    const form = event.target.closest("form[data-form]");
    if (!form) return; event.preventDefault();
    if (state.pending) return;
    if (form.dataset.form === "add") {
      if (!state.newName.trim() || !flush()) return;
      state.items.push({ id:uid(),name:state.newName.trim(),category:"미분류" });
      state.newName = ""; state.started = true; renderAndSave("#ce-new-name");
    } else if (form.dataset.form === "rename") {
      if (flush()) renderAndSave("#ce-new-name");
    } else if (form.dataset.form === "category") {
      const category = root.querySelector("#ce-category-value").value.trim() || "미분류";
      const itemId = modal.dataset.itemId;
      if (itemId) state.items = state.items.map(item => item.id === itemId ? { ...item,category } : item);
      else state.guestCategory = category;
      closeModal(); renderAndSave(itemId ? selectorFor("category",itemId) : selectorFor("guest-category"));
    } else if (form.dataset.form === "bulk") {
      const lines = root.querySelector("#ce-bulk-value").value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
      if (!lines.length) { root.querySelector("#ce-bulk-value").focus(); return; }
      state.items.push(...lines.map(name => ({ id:uid(),name:name.slice(0,80),category:"미분류" })));
      state.started = true; closeModal(); renderAndSave("#ce-new-name"); announce(lines.length + "개 후보를 추가했습니다.");
    } else if (form.dataset.form === "save") {
      const name = root.querySelector("#ce-save-name").value.trim();
      if (!name) return;
      state.library.push({ name,items:saveDraftItems.map(item => ({ name:item.name,category:item.category })) });
      closeModal(); renderAndSave(); announce("내 목록에 사본을 저장했습니다.");
    } else if (form.dataset.form === "recommend" && state.phase === "collecting" && state.guestName.trim()) {
      const wasDirty = dirty();
      state.shared.push({ id:uid(),name:state.guestName.trim(),category:state.guestCategory,owner:"민지" });
      state.sharedVersion++;
      if (!wasDirty) { state.items = copy(state.shared); state.draftVersion = state.sharedVersion; }
      state.guestName = ""; state.guestCategory = "미분류"; renderAndSave("#ce-guest-name"); announce("후보를 추천했습니다.");
    }
  });
  root.addEventListener("click",event => {
    const submit = event.target.closest('button[type="submit"]');
    if (submit && root.contains(submit)) {
      event.preventDefault();
      if (!submit.disabled && submit.form) submit.form.dispatchEvent(new Event("submit",{ bubbles:true,cancelable:true }));
      return;
    }
    const target = event.target.closest("[data-action]");
    if (!target || !root.contains(target) || target.disabled) return;
    const action = target.dataset.action;
    if (action === "modal-close") { closeModal(); return; }
    if (action === "confirm-cancel") { closeConfirm(); return; }
    if (action === "confirm-accept") { const accept = confirmationAction; closeConfirm(); if (accept) accept(); return; }
    if (state.pending) return;
    lastTrigger = target;
    const item = state.items.find(entry => entry.id === target.dataset.id);
    if (["finalize","open-intake","close-intake"].includes(action)) { changeStage(action); return; }
    if (action === "write") { state.started = true; renderAndSave("#ce-new-name"); }
    else if (action === "load") { if (flush()) openLoad(); }
    else if (action === "source") loadSource(target.dataset.source);
    else if (action === "rename" && item) {
      if (!flush()) return;
      state.editId = item.id; state.editName = item.name; renderAndSave("#ce-row-name");
    } else if (action === "category" && item) { if (flush()) { render(); openCategory(item); } }
    else if (action === "guest-category" && state.phase === "collecting") openCategory(null);
    else if (action === "row-menu" && item) {
      const wasEditing = !!state.editId;
      if (!flush()) return;
      if (wasEditing) renderAndSave();
      const trigger = wasEditing ? root.querySelector(selectorFor("row-menu",item.id)) : target;
      openRowPopup(state.items.find(entry => entry.id === item.id),trigger,false,true);
    } else if (action === "row-include" && item) {
      state.manual = state.manual.includes(item.id) ? state.manual.filter(id => id !== item.id) : [...state.manual,item.id];
      closeRowPopup(false); renderAndSave(selectorFor("row-menu",item.id));
    } else if (action === "row-delete" && item) {
      undo = { item:copy(item),index:state.items.indexOf(item),excluded:state.manual.includes(item.id) };
      state.items = state.items.filter(entry => entry.id !== item.id); state.manual = state.manual.filter(id => id !== item.id);
      closeRowPopup(false); renderAndSave("#ce-new-name"); announce(item.name + " 삭제됨. 되돌릴 수 있습니다.");
    } else if (action === "undo" && undo) {
      state.items.splice(Math.min(undo.index,state.items.length),0,undo.item);
      if (undo.excluded) state.manual.push(undo.item.id);
      undo = null; renderAndSave();
    } else if (action === "filter-toggle") {
      if (!flush()) return;
      state.filterOpen = !state.filterOpen;
      if (!state.filterOpen) state.query = "";
      renderAndSave(selectorFor("filter-toggle"));
    } else if (action === "filter-cat") {
      const cats = state.categories === null ? [...new Set(state.items.map(entry => entry.category))] : state.categories;
      state.categories = cats.includes(target.dataset.category) ? cats.filter(cat => cat !== target.dataset.category) : [...cats,target.dataset.category];
      renderAndSave('[data-action="filter-cat"][data-category="' + target.dataset.category.replace(/["\\]/g,"") + '"]');
    } else if (action === "filter-all" || action === "filter-reset") {
      state.categories = null; if (action === "filter-reset") state.manual = []; renderAndSave(selectorFor("filter-toggle"));
    } else if (action === "bulk") {
      if (!flush()) return;
      dialog("여러 개 추가",'<form data-form="bulk" class="ce-dialog-form"><label>한 줄에 후보 하나<textarea id="ce-bulk-value" rows="6" placeholder="김치찌개&#10;돈가스&#10;샐러드" autofocus required></textarea></label><div class="ce-dialog-actions"><button type="button" data-action="modal-close">취소</button><button type="submit" class="ce-primary">후보 추가</button></div></form>',selectorFor("bulk"));
    } else if (action === "save") {
      if (!flush() || (!state.items.length && !state.newName.trim())) return;
      saveDraftItems = copy(state.items);
      if (state.newName.trim()) saveDraftItems.push({ name:state.newName.trim(),category:"미분류" });
      dialog("내 목록에 저장",'<form data-form="save" class="ce-dialog-form"><label>목록 이름<input id="ce-save-name" value="우리 점심 후보" maxlength="40" required autofocus></label><p class="ce-note">전체 후보 ' + saveDraftItems.length + '개를 새 사본으로 저장합니다.</p><div class="ce-dialog-actions"><button type="button" data-action="modal-close">취소</button><button type="submit" class="ce-primary">저장</button></div></form>',selectorFor("save"));
    } else if (action === "clear") {
      ask("후보를 모두 비울까요?","편집 중인 후보와 필터를 비웁니다. 적용된 공유 목록과 저장본은 유지됩니다.",() => { state.items = []; state.categories = null; state.manual = []; state.editId = null; state.newName = ""; state.query = ""; undo = null; renderAndSave("#ce-new-name"); },"전체 비우기");
    } else if (action === "discard" || action === "back") {
      if (action === "back" && state.phase !== "editing") return;
      const apply = () => { resetDraft(); if (action === "back") state.phase = "waiting"; renderAndSave("#ce-new-name"); };
      if (dirty()) ask("편집한 내용을 버릴까요?","아직 적용하지 않은 변경만 버립니다. 공유 후보와 저장 목록은 유지됩니다.",apply,"변경 버리기"); else apply();
    } else if (action === "review-remote") {
      dialog("새 추천 확인",'<p class="ce-note">현재 초안은 보관 중입니다. 최신 공유 목록 ' + state.shared.length + '개를 확인해 주세요.</p><ul class="ce-readonly">' +
        state.shared.filter(entry => !state.items.some(local => local.id === entry.id)).map(entry => '<li>' + esc(entry.name) + '<small>' + esc(entry.owner || "방장") + ' 추천</small></li>').join("") +
        '</ul><div class="ce-dialog-actions"><button type="button" data-action="modal-close">초안 유지</button><button type="button" data-action="use-latest">최신 목록 사용</button></div>',selectorFor("review-remote"));
    } else if (action === "use-latest") {
      ask("최신 목록으로 바꿀까요?","적용하지 않은 편집 초안을 버리고 새 추천을 포함한 공유 목록을 불러옵니다.",() => { resetDraft(); closeModal(); renderAndSave("#ce-new-name"); },"최신 목록 사용");
    } else if (action === "guest-delete") {
      const entry = state.shared.find(value => value.id === target.dataset.id && value.owner === "민지");
      if (!entry || state.phase !== "collecting") return;
      ask("내 추천을 삭제할까요?",entry.name + " 후보가 공유 목록에서 삭제됩니다.",() => {
        if (state.phase !== "collecting") return;
        const wasDirty = dirty();
        state.shared = state.shared.filter(value => value.id !== entry.id);
        state.sharedManual = state.sharedManual.filter(id => id !== entry.id); state.sharedVersion++;
        if (!wasDirty) { state.items = copy(state.shared); state.manual = [...state.sharedManual]; state.draftVersion = state.sharedVersion; }
        renderAndSave("#ce-guest-name");
      },"추천 삭제");
    } else if (action === "view-candidates") viewCandidates();
    else if (action === "edit" && state.phase === "waiting") { resetDraft(); state.phase = "editing"; renderAndSave("#ce-new-name"); }
    else if (action === "spin") spin(false);
    else if (action === "next" && state.phase === "result") { state.phase = "waiting"; renderAndSave(); }
    else if (action === "reset-drawn" && state.phase !== "drawing") ask("제외 내역을 초기화할까요?","모든 당첨 제외 내역을 비웁니다. 현재 결과는 유지됩니다.",() => { state.drawn = []; renderAndSave(); },"초기화");
  });
  root.addEventListener("keydown",event => {
    if (rowPopupActive && rowPopup.contains(event.target)) {
      const items = [...rowPopup.querySelectorAll('[role="menuitem"]')];
      const index = items.indexOf(root.ownerDocument.activeElement);
      if (["ArrowDown","ArrowUp","Home","End"].includes(event.key)) {
        event.preventDefault();
        const next = event.key === "Home" ? 0 : event.key === "End" ? items.length - 1 : (index + (event.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items[next].focus({ preventScroll:true }); return;
      }
      if (event.key === "Escape") { event.preventDefault(); closeRowPopup(true); return; }
    }
    const rowTrigger = event.target.closest('[data-action="row-menu"]');
    if (rowTrigger && ["ArrowDown","ArrowUp"].includes(event.key) && !state.pending) {
      event.preventDefault();
      const wasEditing = !!state.editId;
      const itemId = rowTrigger.dataset.id;
      if (!flush()) return;
      if (wasEditing) renderAndSave();
      const item = state.items.find(entry => entry.id === itemId);
      const trigger = wasEditing ? root.querySelector(selectorFor("row-menu",itemId)) : rowTrigger;
      if (item) openRowPopup(item,trigger,event.key === "ArrowUp");
      return;
    }
    if (event.key === "Enter" && event.target.tagName === "INPUT" && !event.isComposing) {
      const form = event.target.closest("form[data-form]");
      if (form) {
        event.preventDefault();
        form.dispatchEvent(new Event("submit",{ bubbles:true,cancelable:true }));
        return;
      }
    }
    if (event.key !== "Escape" || modal.open || confirm.open) return;
    const menu = root.querySelector("details[open]");
    if (menu) { menu.open = false; menu.querySelector("summary").focus(); return; }
    if (state.editId) { const id = state.editId; state.editId = null; state.error = ""; renderAndSave(selectorFor("rename",id)); }
  });
  modal.addEventListener("cancel",event => { event.preventDefault(); closeModal(); });
  confirm.addEventListener("cancel",event => { event.preventDefault(); closeConfirm(); });
  window.addEventListener("openai:set_globals",event => {
    const saved = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (!saved || !saved.privateContent || modal.open || confirm.open || state.pending) return;
    const signature = JSON.stringify(saved.privateContent);
    if (signature === lastSavedState) return;
    lastSavedState = signature;
    state = restore(saved.privateContent); settings.example = state.example;
    settings.showGuest = state.showGuest !== false;
    render();
  });
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container:root,onChange:() => {
      if (settings.example !== state.example) {
        if (drawingTimer) clearTimeout(drawingTimer);
        if (confirm.open) closeConfirm(); if (modal.open) closeModal();
        state = initial(settings.example); undo = null;
      }
      if (settings.failSave) { state.failNext = true; settings.failSave = false; }
      renderAndSave();
    } });
    tweak.addSelect(settings,"example",{ label:"예시 목록",options:["혼합 후보","빈 목록","긴 목록"] });
    tweak.addToggle(settings,"showGuest",{ label:"참가자 화면 함께 보기" });
    tweak.addToggle(settings,"failSave",{ label:"다음 저장 실패 예시" });
  }
})();
</script>
