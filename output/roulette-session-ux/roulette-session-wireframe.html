<div id="roulette-session-wireframe">
  <div class="rw-preview">
    <label>게임 예시 <select id="rw-scenario" class="form-select"><option value="menu">메뉴 후보 · 확률 투표 사용</option><option value="numbers">번호 후보 · 확률 투표 없음</option></select></label>
    <label>미리볼 상태 <select id="rw-phase" class="form-select"><option value="locked">대기 · 룰렛과 후보</option><option value="collect">추천 접수 중</option><option value="review">접수 종료 · 목록 확인</option><option value="drawing">추첨 중</option><option value="result">결과</option></select></label>
    <label>시작 방식 검토 <select id="rw-start-mode" class="form-select"><option value="close">방장 시작</option><option value="ready">변경 후 Ready 확인</option></select></label>
    <button type="button" class="btn btn-ghost" id="rw-next-preview">다음 단계 미리보기</button>
  </div>
  <div class="rw-role-comparison viz-dotted-background" aria-label="방장과 참가자 화면 동시 비교">
    <section class="rw-role-preview" aria-label="방장 시나리오">
      <h3 class="rw-preview-heading">방장 화면</h3>
      <div class="rw-app" data-flow="host" data-role="host" aria-label="방장 룰렛 화면"></div>
    </section>
    <section class="rw-role-preview" aria-label="참가자 시나리오">
      <h3 class="rw-preview-heading">참가자 화면</h3>
      <div class="rw-app" data-flow="guest" data-role="guest" aria-label="참가자 룰렛 화면"></div>
    </section>
  </div>
</div>
<style>
  #roulette-session-wireframe .rw-preview {display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding-right:90px}
  #roulette-session-wireframe .rw-preview label {display:grid;gap:6px}
  #roulette-session-wireframe .rw-role-comparison {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;padding:12px 0 24px}
  #roulette-session-wireframe .rw-role-preview {min-width:0}
  #roulette-session-wireframe .rw-preview-heading {margin:0 0 10px;font-weight:500}
  #roulette-session-wireframe .rw-app {
    --rw-paper:light-dark(#f7f7f2,#20241e);--rw-card:light-dark(#ffffff,#292e27);
    --rw-ink:light-dark(#272b24,#eef2e7);--rw-soft:light-dark(#edf2e3,#343d2c);
    --rw-line:light-dark(#c3ccb7,#626e55);--rw-lime:light-dark(#d6f266,#c0da62);
    --rw-on-lime:#272b24;--rw-muted:light-dark(#59634f,#c3cdb8);--rw-danger:light-dark(#a13d27,#ffb79e);
    --rw-wheel-a:light-dark(#d6f266,#536329);
    --rw-accent:light-dark(#3f5e25,#d4edb9);
    color:var(--rw-ink);background:var(--rw-paper);border:2px solid var(--rw-line);border-radius:2px;
    font:14px/1.55 "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    max-width:680px;margin:0 auto;text-align:left;overflow-wrap:anywhere;position:relative;container-type:inline-size;
  }
  #roulette-session-wireframe .rw-app * {box-sizing:border-box}
  #roulette-session-wireframe .rw-app [hidden] {display:none}
  #roulette-session-wireframe .rw-app button,#roulette-session-wireframe .rw-app input,
  #roulette-session-wireframe .rw-app select,#roulette-session-wireframe .rw-app textarea {font:inherit;color:inherit;border-radius:2px}
  #roulette-session-wireframe .rw-app button {min-height:44px;border:1px solid var(--rw-line);background:var(--rw-card);padding:8px 12px;font-weight:500}
  #roulette-session-wireframe .rw-app button:disabled {opacity:.48;cursor:not-allowed}
  #roulette-session-wireframe .rw-app button[aria-pressed="true"] {background:var(--rw-lime);color:var(--rw-on-lime);border-color:var(--rw-accent)}
  #roulette-session-wireframe .rw-app .rw-primary {background:var(--rw-lime);color:var(--rw-on-lime);border-color:var(--rw-ink)}
  #roulette-session-wireframe .rw-app .rw-quiet {border-color:transparent;background:transparent;color:var(--rw-accent);padding-inline:4px}
  #roulette-session-wireframe .rw-app input:not([type="checkbox"]),#roulette-session-wireframe .rw-app textarea {width:100%;min-width:0;background:var(--rw-card);border:1px solid var(--rw-line);padding:10px;font-size:16px}
  #roulette-session-wireframe .rw-app textarea {min-height:160px;resize:vertical}
  #roulette-session-wireframe .rw-app input[type="checkbox"] {width:18px;height:18px;accent-color:var(--rw-accent);flex-shrink:0}
  #roulette-session-wireframe .rw-app h2 {font-size:21px;font-weight:500;line-height:1.35;margin:0}
  #roulette-session-wireframe .rw-app h3 {font-size:16px;font-weight:500;margin:0}
  #roulette-session-wireframe .rw-app p {margin:0}
  #roulette-session-wireframe .rw-brand {padding:12px 18px;background:var(--rw-lime);color:var(--rw-on-lime);font-weight:500;display:flex;gap:12px;align-items:center}
  #roulette-session-wireframe .rw-brand span {font-weight:400;font-size:12px}
  #roulette-session-wireframe .rw-body {padding:18px;display:grid;gap:18px}
  #roulette-session-wireframe .rw-heading {display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  #roulette-session-wireframe .rw-meta {font-size:12px;color:var(--rw-muted);margin-top:4px!important}
  #roulette-session-wireframe .rw-steps {display:flex;list-style:none;margin:0;padding:0;gap:0;border-bottom:1px solid var(--rw-line)}
  #roulette-session-wireframe .rw-steps li {flex:1;padding:8px 4px;text-align:center;color:var(--rw-muted);font-size:12px}
  #roulette-session-wireframe .rw-steps li[aria-current="step"] {color:var(--rw-ink);border-bottom:3px solid var(--rw-accent);background:var(--rw-soft)}
  #roulette-session-wireframe .rw-phase {display:grid;gap:8px}
  #roulette-session-wireframe .rw-strip {display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--rw-soft);font-size:12px}
  #roulette-session-wireframe .rw-intake-status {font-size:12px;color:var(--rw-accent)}
  #roulette-session-wireframe .rw-candidate-summary {display:grid;gap:8px}
  #roulette-session-wireframe .rw-candidate-names {display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
  #roulette-session-wireframe .rw-candidate-names li {padding:4px 9px;background:var(--rw-soft);font-size:13px}
  #roulette-session-wireframe .rw-list {list-style:none;margin:0;padding:0;border-top:1px solid var(--rw-line)}
  #roulette-session-wireframe .rw-item {display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rw-line)}
  #roulette-session-wireframe .rw-name {min-width:0;flex:1}
  #roulette-session-wireframe .rw-name strong {font-weight:500;display:block}
  #roulette-session-wireframe .rw-name small {color:var(--rw-muted);font-size:12px}
  #roulette-session-wireframe .rw-votes {display:flex;align-items:center;gap:4px;flex-shrink:0}
  #roulette-session-wireframe .rw-votes button {min-width:44px;padding:8px}
  #roulette-session-wireframe .rw-percent {width:62px;text-align:right;font-variant-numeric:tabular-nums}
  #roulette-session-wireframe .rw-percent small {font-size:11px;color:var(--rw-muted);display:block}
  #roulette-session-wireframe .rw-add {display:flex;align-items:center;gap:8px}
  #roulette-session-wireframe .rw-add button {white-space:nowrap}
  #roulette-session-wireframe .rw-label {display:grid;gap:6px}
  #roulette-session-wireframe .rw-actions {display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #roulette-session-wireframe .rw-actions>.rw-primary {flex:1}
  #roulette-session-wireframe .rw-foot {padding-top:14px;border-top:1px solid var(--rw-line);display:grid;gap:8px}
  #roulette-session-wireframe .rw-check {display:flex;align-items:center;gap:10px;min-height:44px}
  #roulette-session-wireframe .rw-options {display:grid;gap:14px;background:var(--rw-card);border:1px solid var(--rw-line);padding:16px}
  #roulette-session-wireframe .rw-dialog {position:absolute;inset:12px 12px auto;width:calc(100% - 24px);max-width:600px;max-height:calc(100% - 24px);margin:0 auto;padding:0;border:2px solid var(--rw-line);border-radius:2px;color:var(--rw-ink);background:var(--rw-card);overscroll-behavior:contain;z-index:51}
  #roulette-session-wireframe .rw-dialog-backdrop {position:absolute;inset:0;background:light-dark(rgb(25 31 20 / 36%),rgb(4 8 3 / 60%));z-index:50}
  #roulette-session-wireframe .rw-dialog-head {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rw-line);background:var(--rw-soft)}
  #roulette-session-wireframe .rw-dialog-body {display:grid;gap:16px;padding:16px}
  #roulette-session-wireframe .rw-dialog .rw-options {border:0;padding:0}
  #roulette-session-wireframe .rw-option-values {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;margin:0;padding:12px;background:var(--rw-soft)}
  #roulette-session-wireframe .rw-option-values dd {margin:0;text-align:right}
  #roulette-session-wireframe .rw-dialog .rw-list {max-height:none}
  #roulette-session-wireframe .rw-summary {margin:0;padding-left:20px;display:grid;gap:6px}
  #roulette-session-wireframe .rw-result {padding:24px 14px;text-align:center;background:var(--rw-card);border:1px solid var(--rw-line);display:grid;gap:10px}
  #roulette-session-wireframe .rw-winner {font-size:30px;font-weight:500}
  #roulette-session-wireframe .rw-waiting {color:var(--rw-muted);font-size:13px}
  #roulette-session-wireframe .rw-roster {display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
  #roulette-session-wireframe .rw-roster span {background:var(--rw-soft);padding:6px 10px}
  #roulette-session-wireframe .rw-error {color:var(--rw-danger)}
  #roulette-session-wireframe .rw-sr-only {position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  #roulette-session-wireframe .rw-history summary {min-height:44px;display:flex;align-items:center;color:var(--rw-accent);cursor:default}
  #roulette-session-wireframe .rw-history ol {margin:0;padding-left:22px;font-size:12px}
  #roulette-session-wireframe .rw-removed {display:grid;gap:6px;color:var(--rw-muted);font-size:12px}
  #roulette-session-wireframe .rw-wheel-stage {display:grid;justify-items:center;gap:12px;padding:10px 0}
  #roulette-session-wireframe .rw-wheel-layout {display:grid;grid-template-columns:minmax(0,1fr) 164px;gap:16px;align-items:start}
  #roulette-session-wireframe .rw-exclusion-panel {min-width:0;display:grid;gap:10px;padding:12px;background:var(--rw-soft);border:1px solid var(--rw-line)}
  #roulette-session-wireframe .rw-exclusion-panel h3 {font-size:14px}
  #roulette-session-wireframe .rw-exclusion-list {list-style:none;display:grid;gap:6px;margin:0;padding:0}
  #roulette-session-wireframe .rw-exclusion-list li {padding:3px 0;border-bottom:1px solid var(--rw-line);font-size:13px}
  #roulette-session-wireframe .rw-wheel {position:relative;width:min(100%,340px);aspect-ratio:1;isolation:isolate}
  #roulette-session-wireframe .rw-wheel::before {content:'▼';position:absolute;top:-10px;left:calc(50% - 12px);font-size:26px;color:var(--rw-ink);z-index:3}
  #roulette-session-wireframe .rw-rotor {position:absolute;inset:0;border:2px solid var(--rw-ink);border-radius:50%;overflow:hidden;transform:rotate(var(--rw-turn,0deg))}
  #roulette-session-wireframe .rw-rotor[data-spinning="true"] {animation:rw-spin 1.8s cubic-bezier(.15,.65,.12,1) both}
  #roulette-session-wireframe .rw-wheel-label {position:absolute;width:24%;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:var(--rw-ink)}
  #roulette-session-wireframe .rw-hub {position:absolute;inset:36%;border-radius:50%;background:var(--rw-card);display:grid;place-content:center;text-align:center;border:1px solid var(--rw-line);font-size:13px;z-index:2}
  #roulette-session-wireframe .rw-candidates summary {min-height:44px;display:flex;align-items:center;gap:8px;color:var(--rw-accent)}
  #roulette-session-wireframe .rw-candidates summary::before {content:'＋'}
  #roulette-session-wireframe .rw-candidates[open] summary::before {content:'−'}
  #roulette-session-wireframe .rw-candidates .rw-list {margin-top:8px}
  @keyframes rw-spin {from{transform:rotate(0deg)}to{transform:rotate(var(--rw-turn))}}
  @media(prefers-reduced-motion:reduce) {#roulette-session-wireframe .rw-rotor[data-spinning="true"]{animation:none}}
  #roulette-session-wireframe .rw-number-list {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;padding:0;margin:0;gap:8px}
  #roulette-session-wireframe .rw-number-list button {display:grid;gap:3px;width:100%;min-height:66px;padding:6px;background:var(--rw-card)}
  #roulette-session-wireframe .rw-number-list button[aria-pressed="true"] {background:var(--rw-soft);color:var(--rw-ink);border-color:var(--rw-line)}
  #roulette-session-wireframe .rw-number-list small {font-size:11px}
  @media(max-width:760px) {#roulette-session-wireframe .rw-role-comparison {grid-template-columns:minmax(0,1fr)}}
  @container(max-width:560px) {#roulette-session-wireframe .rw-wheel-layout {grid-template-columns:minmax(0,1fr)}}
  @media(max-width:440px) {
    #roulette-session-wireframe .rw-preview {padding-right:0;gap:10px}
    #roulette-session-wireframe .rw-preview label {width:100%}
    #roulette-session-wireframe .rw-body {padding:12px;gap:14px}
    #roulette-session-wireframe .rw-brand {padding:10px 12px}
    #roulette-session-wireframe .rw-item {flex-wrap:wrap;gap:6px}
    #roulette-session-wireframe .rw-name {flex-basis:100%}
    #roulette-session-wireframe .rw-percent {margin-left:auto}
    #roulette-session-wireframe .rw-heading button {min-height:36px}
    #roulette-session-wireframe .rw-actions>button {flex-basis:100%}
  }
</style>
<script>
(() => {
  const root = document.getElementById('roulette-session-wireframe');
  const scenarioControl = root.querySelector('#rw-scenario');
  const phaseControl = root.querySelector('#rw-phase');
  const modeControl = root.querySelector('#rw-start-mode');
  const apps = Array.from(root.querySelectorAll('[data-flow]'));
  let readyMode = false;
  let scenario = 'menu';
  let serial = 100;
  const states = {};
  let resultTimer = null;
  let resultToken = null;
  const sharedKeys=['title','round','phase','items','votes','excluded','manual','autoExclude','allowAdd','useVotes','ready','locked','result','history','rotation','notice','feedback','drawContext','drawSeq'];
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const clone = value => JSON.parse(JSON.stringify(value));
  const button = (action, text, options = '') => `<button type="button" class="cursor-interaction" data-action="${action}" ${options}>${text}</button>`;
  const primary = (action, text, disabled = false) => `<button type="button" class="rw-primary cursor-interaction" data-action="${action}" ${disabled ? 'disabled' : ''}>${text}</button>`;
  function fresh() {
    const numeric = scenario === 'numbers';
    const names = numeric ? Array.from({length:10}, (_,i) => `${i+1}번`) : ['김치찌개', '돈가스', '쌀국수', '카레'];
    const s={title:numeric?'번호 중복 없이 뽑기':'오늘은 뭐 먹지?', round:1, phase:'locked',
      items:names.map((name,i) => ({id:`c${++serial}`,name,owner:i===2?'민수':'방장'})),
      votes:{},excluded:[],manual:[],autoExclude:numeric,allowAdd:false,useVotes:!numeric,
      ready:{host:true,guest:true,other:true},locked:null,result:null,history:[],edit:null,panel:false,error:'',notice:'',rotation:0,feedback:{},suggestionDraft:'',drawContext:null,drawSeq:0,resetConfirm:null,resetReturnFocus:'advance'};
    s.locked=clone(probabilities(s));return s;
  }
  function eligible(s) {return s.items.filter(x=>(!s.autoExclude||!s.excluded.includes(x.id))&&!s.manual.includes(x.id));}
  function probabilities(s) {
    const items = eligible(s);
    const weights = items.map(x=>s.useVotes?Math.max(1,2+Object.values(s.votes).reduce((sum,ballot)=>sum+(ballot[x.id]||0),0)):1);
    const total = weights.reduce((a,b)=>a+b,0);
    return items.map((x,i)=>({...x,probability:weights[i]/total}));
  }
  function lock(s) {s.allowAdd=false;s.locked=clone(probabilities(s));s.phase='locked';s.ready={host:true,guest:!readyMode,other:true};}
  function archive(s) {
    if(!s.result)return;
    s.history.unshift({round:s.round,name:s.result.name,probability:s.result.probability,items:clone(s.locked),drawId:s.drawContext?.id,autoExclude:s.drawContext?.autoExclude});
    s.result=null;s.drawContext=null;
  }
  function visibleLedger(s) {
    return s.phase==='drawing'&&s.drawContext?(s.drawContext.autoExclude?s.drawContext.ledgerBefore:[]):s.excluded;
  }
  function resetSignature(s) {
    return JSON.stringify([s.phase,s.round,s.drawContext?.id,readyMode,s.autoExclude,s.excluded,s.manual,s.items,s.votes,s.locked,s.ready]);
  }
  function setIntake(s,open) {
    if(open) {
      if(s.result){archive(s);s.round++;}
      s.allowAdd=true;s.phase='collect';s.locked=null;s.ready={host:true,guest:false,other:true};
      s.notice='후보 추천을 받고 있어요.';
    }else {
      s.allowAdd=false;s.phase='review';
      s.notice='추천 접수를 끝냈어요. 목록을 확인한 뒤 마감해 주세요.';
    }
  }
  function candidateChanged(s) {
    const hadVotes=Object.values(s.votes).some(ballot=>Object.values(ballot).some(Boolean));
    s.votes={};s.ready={host:true,guest:false,other:true};
    if(hadVotes)s.notice='후보가 바뀌어 확률 투표를 다시 받아요.';
  }
  function advance(s,key,resetApproved=false) {
    if(s.phase==='result') {
      archive(s);s.round++;s.locked=clone(probabilities(s));s.phase='locked';s.rotation=0;
      s.notice='다음 게임 대기 · 후보와 옵션을 확인한 뒤 돌려 주세요.';return;
    }
    if(['collect','review'].includes(s.phase)){if(eligible(s).length===0)return;lock(s);}
    else if(s.phase==='locked') {
      if(readyMode&&!Object.values(s.ready).every(Boolean))return;
      const list=s.locked||[];if(!list.length)return;
      if(!s.autoExclude&&s.excluded.length&&!resetApproved){s.panel=false;s.error='';s.resetReturnFocus='advance';s.resetConfirm={kind:'draw',signature:resetSignature(s)};return;}
      let target=Math.random(),winner=list[list.length-1],before=0;
      for(const item of list){if(target<item.probability){winner=item;break;}target-=item.probability;before+=item.probability;}
      s.rotation=1800+360-(before+winner.probability/2)*360;
      const ledgerBefore=clone(s.excluded),autoExclude=s.autoExclude;
      s.drawContext={id:`preview-draw-${++s.drawSeq}`,autoExclude,ledgerBefore,committed:true};
      s.excluded=autoExclude?[...new Set([...ledgerBefore,winner.id])]:[winner.id];
      s.result=clone(winner);s.phase='drawing';s.feedback={};
    } else if(s.phase==='drawing')s.phase='result';
    s.notice='';s.error='';
  }
  function persist() {
    if(!window.openai?.setWidgetState)return;
    window.openai.setWidgetState({modelContent:{scenario,roles:['host','guest'],readyMode,confirmed:false},privateContent:{scenario,readyMode}}).catch(()=>{});
  }
  function restore(raw) {
    const v=raw?.privateContent||raw?.modelContent||raw;
    if(!v||!['menu','numbers'].includes(v.scenario))return;
    if(v.scenario===scenario&&Boolean(v.readyMode)===readyMode)return;
    scenario=v.scenario;readyMode=Boolean(v.readyMode);
    scenarioControl.value=scenario;modeControl.value=readyMode?'ready':'close';
    resetRoom();renderAll();
  }
  function resetRoom() {
    if(resultTimer)clearTimeout(resultTimer);resultTimer=null;resultToken=null;
    const seed=fresh();
    apps.forEach(app=>{states[app.dataset.flow]=clone(seed);});
  }
  function syncRoom(key) {
    apps.forEach(app=>{
      if(app.dataset.flow===key)return;
      const target=states[app.dataset.flow],source=states[key];
      sharedKeys.forEach(field=>{target[field]=clone(source[field]);});
    });
  }
  function resetDraft(s) {
    const base={title:s.title,names:s.items.map(x=>x.name).join('\n'),autoExclude:s.autoExclude,useVotes:s.useVotes};
    s.edit={...base,step:'form',base:clone(base)};s.error='';
  }
  function draftChanged(s) {
    return s.edit&&Object.keys(s.edit.base).some(key=>s.edit[key]!==s.edit.base[key]);
  }
  function closePanel(s) {
    if(draftChanged(s)){s.edit.discard=true;return;}
    s.panel=false;s.edit=null;s.reopen=false;s.error='';
  }
  function draftView(s) {
    const d=s.edit;
    if(d.discard)return `<section class="rw-options" aria-label="편집 내용 취소 확인"><h3>편집한 내용을 버릴까요?</h3><p>현재 방에 적용된 후보와 옵션은 유지돼요.</p><div class="rw-actions">${button('continue-edit','계속 편집')}${primary('discard-edit','버리고 닫기')}</div></section>`;
    if(d.step==='confirm') {
      const listChanged=d.parsed.join('\n')!==s.items.map(x=>x.name).join('\n');
      const conditionsChanged=listChanged||['autoExclude','useVotes'].some(k=>d[k]!==s[k]);

  function panelView(s,key) {
    if(!s.panel)return '';

      content=`<p class="rw-meta">${fixed?'이번 추첨의 확정 후보와 옵션':'현재 준비 중인 후보와 옵션'} · 추첨 포함 ${list.length}개</p><ul class="rw-list" aria-label="후보와 확률">${s.items.map(item=>{

      }).join('')}</ul><dl class="rw-option-values"><dt>중복 없이 추첨</dt><dd>${s.autoExclude?'사용':'사용 안 함'}</dd><dt>후보 추천 접수</dt><dd>${s.allowAdd?'접수 중':s.phase==='review'?'접수 종료 · 목록 확인 중':'마감 완료'}</dd><dt>접수 종료 후 확률 투표</dt><dd>${s.useVotes?'사용':'사용 안 함'}</dd><dt>시작 방식</dt><dd>${readyMode?'변경 후 준비 확인':'방장 시작'}</dd></dl>`;
      if(role==='host')content+=`<div class="rw-actions">${button('settings','후보·옵션 편집',s.phase==='drawing'?'disabled':'')}</div>${s.phase==='drawing'?'<p class="rw-meta">추첨 중에는 후보와 옵션을 편집할 수 없어요.</p>':''}`;

  function resetDialog(s,key) {

    return `<dialog class="rw-dialog" data-reset-confirmation aria-labelledby="rw-reset-title-${key}"><div class="rw-dialog-head"><h2 id="rw-reset-title-${key}">${drawing?'제외 목록을 초기화하고 돌릴까요?':'제외 목록을 초기화할까요?'}</h2></div><div class="rw-dialog-body"><p>저장된 제외 후보 ${names.length}개</p><ul class="rw-exclusion-list">${names.map(name=>`<li>${name}</li>`).join('')}</ul><p>${drawing?'기존 목록을 지우고 추첨해요. 새 당첨 후보만 저장되며, 다시 ON으로 켜면 그 후보만 제외돼요.':'저장된 제외 목록을 비워요. 룰렛을 돌리지는 않아요.'}</p><p class="rw-meta">직접 제외한 후보와 지난 게임 기록은 유지돼요.</p><div class="rw-actions">${button('cancel-reset','취소')}${primary('confirm-reset',drawing?'초기화하고 돌리기':'제외 목록 초기화')}</div></div></dialog>`;
  }
  function exclusionView(s,key) {

  function wheelView(s,list) {
    if(!list.length)return '<p class="rw-waiting">모든 후보를 뽑았어요. 당첨 제외를 복원하거나 후보를 바꿔 주세요.</p>';
    const colors=['var(--rw-wheel-a)','var(--rw-soft)','var(--rw-card)'];let acc=0;
    const stops=list.map((item,i)=>{const start=acc;acc+=item.probability*100;return `${colors[i%3]} ${start}% ${acc}%`;});
    let angle=0;const labels=list.map(item=>{
      const mid=(angle+item.probability/2)*360;angle+=item.probability;
      const rad=mid*Math.PI/180;
      return `<span class="rw-wheel-label" style="left:${50+Math.sin(rad)*34}%;top:${50-Math.cos(rad)*34}%">${escape(item.name)}</span>`;
    }).join('');
    return `<div class="rw-wheel-stage"><div class="rw-wheel" role="img" aria-label="${list.length}개 확정 후보의 룰렛"><div class="rw-rotor" data-spinning="${s.phase==='drawing'}" style="background:conic-gradient(${stops.join(',')});--rw-turn:${s.phase==='drawing'?s.rotation:0}deg">${labels}</div><div class="rw-hub">${s.phase==='drawing'?'추첨 중':list.length+'개 후보'}</div></div><p class="rw-meta">${s.autoExclude?'당첨 후보 자동 제외 · 같은 조건으로 계속 추첨':'같은 목록·규칙으로 계속 추첨'}</p></div>`;
  }

      <div class="rw-heading"><div><h2>${escape(s.title)}</h2><p class="rw-meta">${s.round}게임 · 3명 참여 · ${isHost?'방장 화면':'참가자 화면 · 민수'}</p></div>${button('show-panel','후보·옵션 보기')}</div>
      ${content}${s.notice?`<p class="rw-meta" role="status">${escape(s.notice)}</p>`:''}
      <details class="rw-history"><summary>이전 게임 기록 · ${s.history.length}개</summary><ol>${s.history.map(h=>`<li>${h.round}게임 · ${escape(h.name)} · ${(h.probability*100).toFixed(1)}% · 당시 후보 ${h.items.length}개</li>`).join('')}</ol></details>
      <p class="rw-sr-only" data-live aria-live="polite">${names[s.phase]}${s.phase==='result'?' · '+escape(s.result.name):''}</p>
    </div></div>${hasDialog?'<div class="rw-dialog-backdrop" aria-hidden="true"></div>':''}${panelView(s,key)}${resetDialog(s,key)}`;
    const dialog=app.querySelector('dialog');
    if(dialog) {
      if(typeof dialog.show==='function')dialog.show();else dialog.setAttribute('open','');
      const cancel=()=>{if(s.resetConfirm){s.resetConfirm=null;afterAction(app,'cancel-reset');}else{closePanel(s);afterAction(app,'close-panel');}};
      dialog.addEventListener('cancel',event=>{event.preventDefault();cancel();});
      dialog.addEventListener('keydown',event=>{
        if(event.key==='Escape'){event.preventDefault();cancel();return;}
        if(event.key!=='Tab')return;
        const controls=Array.from(dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href]'));
        const first=controls[0],last=controls[controls.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      });
    }
  }
  function renderAll(){apps.forEach(render);phaseControl.value=states.host.phase;}
  function afterAction(app,action,id) {
    syncRoom(app.dataset.flow);renderAll();persist();
    scheduleResult();
    const target=Array.from(app.querySelectorAll('[data-action]')).find(el=>el.dataset.action===action&&el.dataset.id===id);
    const current=states[app.dataset.flow];
    if(current.resetConfirm)app.querySelector('[data-action="cancel-reset"]')?.focus();
    else if(current.panel)app.querySelector('dialog button')?.focus();
    else if(action==='cancel-reset')app.querySelector(`[data-action="${current.resetReturnFocus}"]`)?.focus();
    else if(action==='open-intake')app.querySelector('[name="candidate"]')?.focus();
    else if(!states[app.dataset.flow].panel&&action==='close-intake')app.querySelector('[data-action="advance"]')?.focus();
    else if(!states[app.dataset.flow].panel&&['close-panel','cancel-draft','discard-edit','apply-draft'].includes(action))app.querySelector('[data-action="show-panel"]')?.focus();
    else if(target&&!target.disabled&&!states[app.dataset.flow].panel)target.focus();
  }
  function scheduleResult() {
    const s=states.host,round=s.round,winner=s.result?.id,drawId=s.drawContext?.id;
    if(s.phase!=='drawing'){if(resultTimer)clearTimeout(resultTimer);resultTimer=null;resultToken=null;return;}
    const token=drawId||`${round}:${winner}`;
    if(resultTimer&&resultToken===token)return;
    if(resultTimer)clearTimeout(resultTimer);
    resultToken=token;
    resultTimer=setTimeout(()=>{
      resultTimer=null;resultToken=null;
      if(states.host.phase==='drawing'&&states.host.round===round&&states.host.result?.id===winner&&states.host.drawContext?.id===drawId){states.host.phase='result';syncRoom('host');renderAll();}
    },1900);
  }
  apps.forEach(app=>{
    app.addEventListener('click',event=>{
      const control=event.target.closest('[data-action]');
      if(!control||control.disabled)return;
      const s=states[app.dataset.flow],key=app.dataset.flow,role=app.dataset.role,action=control.dataset.action,id=control.dataset.id;
      const admin=['settings','cancel-draft','review-draft','edit-back','apply-draft','advance','open-intake','close-intake','restore','confirm-reset','toggle-manual'];
      if(admin.includes(action)&&role!=='host')return;
      if(action==='show-panel'){s.panel=true;s.error='';}
      else if(action==='close-panel'||action==='cancel-draft')closePanel(s);
      else if(action==='continue-edit'&&s.edit)s.edit.discard=false;
      else if(action==='discard-edit'){s.panel=false;s.edit=null;s.error='';}
      else if(action==='cancel-reset')s.resetConfirm=null;
      else if(action==='confirm-reset') {
        const confirmation=s.resetConfirm;
        if(!confirmation)return;
        s.resetConfirm=null;
        if(confirmation.signature!==resetSignature(s)){s.error='게임 조건이 바뀌었어요. 목록을 확인한 뒤 다시 진행해 주세요.';}
        else if(confirmation.kind==='draw')advance(s,key,true);
        else {
          s.excluded=[];if(s.phase==='locked')s.locked=clone(probabilities(s));
          s.notice='제외 목록을 초기화했어요. 직접 제외와 지난 게임 기록은 유지돼요.';
        }
      }
      else if(action==='advance')advance(s,key);
      else if(action==='open-intake'&&['locked','review'].includes(s.phase)){setIntake(s,true);s.panel=false;}
      else if(action==='close-intake'&&s.phase==='collect'){setIntake(s,false);s.panel=false;}
      else if(['up','down'].includes(action)&&s.phase==='review') {
        if(!s.useVotes)return;
        const vote=action==='up'?1:-1,ballot=s.votes[key]||(s.votes[key]={});ballot[id]=ballot[id]===vote?0:vote;
      } else if(action==='ready'&&s.phase==='locked'&&readyMode&&role==='guest')s.ready.guest=!s.ready.guest;
      else if(['feedback-up','feedback-down'].includes(action)&&s.phase==='result'&&role==='guest'&&!s.feedback[key])s.feedback[key]=action==='feedback-up'?'up':'down';
      else if(action==='remove'&&['collect','review'].includes(s.phase)) {
        const item=s.items.find(x=>x.id===id);if(!item||role!=='host'&&(!s.allowAdd||s.phase!=='collect'||item.owner!=='민수'))return;
        s.items=s.items.filter(x=>x.id!==id);candidateChanged(s);
      } else if(action==='settings'&&['collect','review','locked','result'].includes(s.phase))resetDraft(s);
      else if(action==='review-draft'&&s.edit) {
        const names=s.edit.names.split('\n').map(x=>x.trim()).filter(Boolean);
        if(!s.edit.title.trim()||names.length<1||names.length>20||names.some(x=>x.length>40))s.error='방 이름과 후보 1~20개를 입력해 주세요. 후보 이름은 40자까지예요.';
        else {s.edit.parsed=names;s.edit.step='confirm';s.error='';}
      } else if(action==='edit-back'&&s.edit)s.edit.step='form';
      else if(action==='apply-draft'&&s.edit?.step==='confirm') {
        const d=clone(s.edit),listChanged=d.parsed.join('\n')!==s.items.map(x=>x.name).join('\n');
        const conditionsChanged=listChanged||['autoExclude','useVotes'].some(k=>d[k]!==s[k]);
        const clearVotes=listChanged||d.useVotes!==s.useVotes;
        if(conditionsChanged&&s.result){archive(s);s.round++;s.phase='locked';}
        const oldItems=[...s.items];
        if(listChanged)s.items=d.parsed.map(name=>{const index=oldItems.findIndex(item=>item.name===name);return index<0?{id:`c${++serial}`,name,owner:'방장'}:oldItems.splice(index,1)[0];});
        s.title=d.title.trim();s.autoExclude=d.autoExclude;s.useVotes=d.useVotes;
        const ids=new Set(s.items.map(item=>item.id));s.excluded=s.excluded.filter(id=>ids.has(id));s.manual=s.manual.filter(id=>ids.has(id));
        if(clearVotes)s.votes={};
        if(conditionsChanged){s.ready={host:true,guest:!readyMode,other:true};if(s.phase==='locked')s.locked=clone(probabilities(s));}
        s.edit=null;s.panel=false;s.reopen=false;s.error='';s.notice='변경을 적용했어요. 같은 화면에서 계속할 수 있어요.';
      } else if(action==='restore'&&['collect','review','locked','result'].includes(s.phase)) {
        if(!s.excluded.length)return;
        s.panel=false;s.error='';s.resetReturnFocus='restore';s.resetConfirm={kind:'restore',signature:resetSignature(s)};
      } else if(action==='toggle-manual'&&['collect','review'].includes(s.phase)&&(!s.autoExclude||!s.excluded.includes(id))) {
        s.manual=s.manual.includes(id)?s.manual.filter(x=>x!==id):[...s.manual,id];
        candidateChanged(s);
      }
      afterAction(app,action,id);
    });
    app.addEventListener('submit',event=>{
      if(!event.target.matches('[data-add-form]'))return;
      event.preventDefault();const s=states[app.dataset.flow],role=app.dataset.role;
      if(!(s.phase==='collect'&&s.allowAdd||s.phase==='review'&&role==='host')) {
        s.error='추천 접수가 끝났어요. 입력한 내용은 보관했어요.';render(app);return;
      }
      const field=event.target.querySelector('input'),name=field.value.trim();
      if(!name)return;
      if(s.items.length>=20){s.error='이 미리보기에서는 후보를 20개까지 등록할 수 있어요.';render(app);return;}
      s.items.push({id:`c${++serial}`,name,owner:role==='host'?'방장':'민수'});s.error='';s.suggestionDraft='';candidateChanged(s);
      syncRoom(app.dataset.flow);renderAll();app.querySelector('[name="candidate"]')?.focus();persist();
    });
    app.addEventListener('input',event=>{
      const field=event.target,key=field.dataset.draft,s=states[app.dataset.flow];
      if(field.name==='candidate'){s.suggestionDraft=field.value;return;}
      if(!key||!s.edit)return;s.edit[key]=field.type==='checkbox'?field.checked:field.value;
      const review=app.querySelector('[data-action="review-draft"]');if(review)review.disabled=!draftChanged(s);
    });
    app.addEventListener('change',event=>{
      const field=event.target,s=states[app.dataset.flow];
      if(field.dataset.gameOption!=='autoExclude')return;
      if(app.dataset.role!=='host'||!['locked','result'].includes(s.phase))return;
      s.autoExclude=field.checked;
      if(s.phase==='locked')s.locked=clone(probabilities(s));
      s.notice=`중복 없이 추첨을 ${s.autoExclude?'켰어요':'껐어요'}. 다음 추첨부터 적용해요.`;
      afterAction(app,'quick-option');
    });
  });
  scenarioControl.addEventListener('change',()=>{
    scenario=scenarioControl.value;resetRoom();renderAll();persist();
  });
  phaseControl.addEventListener('change',()=>{
    const phase=phaseControl.value,s=states.host;
    apps.forEach(app=>{const view=states[app.dataset.flow];view.edit=null;view.panel=false;view.resetConfirm=null;view.reopen=false;view.error='';});
    if(s.phase==='result'&&phase!=='result'){archive(s);s.round++;}
    if(['drawing','result'].includes(phase)) {
      s.allowAdd=false;s.locked=clone(probabilities(s));s.phase='locked';s.ready={host:true,guest:true,other:true};
      advance(s,'host');if(phase==='result'&&s.result)s.phase='result';
    }else {
      s.phase=phase;s.allowAdd=phase==='collect';s.result=null;
      s.locked=phase==='locked'?clone(probabilities(s)):null;
      s.ready={host:true,guest:!readyMode,other:true};
    }
    syncRoom('host');renderAll();scheduleResult();persist();
  });
  modeControl.addEventListener('change',()=>{
    readyMode=modeControl.value==='ready';
    if(states.host.phase==='locked')states.host.ready={host:true,guest:!readyMode,other:true};
    syncRoom('host');renderAll();persist();
  });
  root.querySelector('#rw-next-preview').addEventListener('click',()=>{
    const s=states.host;
    apps.forEach(app=>{const view=states[app.dataset.flow];view.edit=null;view.reopen=false;view.panel=false;view.resetConfirm=null;});
    if(s.phase==='locked')s.ready={host:true,guest:true,other:true};
    advance(s,'host');syncRoom('host');renderAll();scheduleResult();persist();
  });
  resetRoom();
  renderAll();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{
    if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);
  });
  if(globalThis.Tweak) {
    apps.forEach(app=>{
      const design={density:18};
      const tweak=new Tweak({container:app,onChange:()=>{app.querySelector('.rw-body').style.gap=`${design.density}px`;}});
      tweak.addSlider(design,'density',{label:'영역 사이 간격',min:12,max:24,step:2,unit:'px'});
    });
  }
})();
</script>
